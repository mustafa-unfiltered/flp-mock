<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLP Mock Exam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centred console column. Sign-in first; then Practice / History / Leaderboard (plus Manage questions for admins). Exam mode takes over with a sticky timer bar and a side palette that stacks under the question on phones. */
:root {
  color-scheme: light;
  --bg: #f2f5f9;
  --surface: #ffffff;
  --surface2: #e9eef5;
  --line: #d2dae6;
  --fg: #15202e;
  --muted: #566377;
  --accent: #14599a;
  --accent-fg: #ffffff;
  --accent-soft: #e1edfa;
  --ok: #17692f;
  --ok-soft: #dff2e4;
  --warn: #8a5200;
  --warn-soft: #fcefd2;
  --bad: #b3261e;
  --bad-soft: #fce6e3;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e;
    --surface: #172030;
    --surface2: #1e2a3c;
    --line: #2d3b52;
    --fg: #e6ebf3;
    --muted: #9aa8bd;
    --accent: #6aaeff;
    --accent-fg: #08111f;
    --accent-soft: #1b2e4a;
    --ok: #6fd596;
    --ok-soft: #163524;
    --warn: #f0b44c;
    --warn-soft: #3a2b0f;
    --bad: #ff8f84;
    --bad-soft: #3d1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e;
  --surface: #172030;
  --surface2: #1e2a3c;
  --line: #2d3b52;
  --fg: #e6ebf3;
  --muted: #9aa8bd;
  --accent: #6aaeff;
  --accent-fg: #08111f;
  --accent-soft: #1b2e4a;
  --ok: #6fd596;
  --ok-soft: #163524;
  --warn: #f0b44c;
  --warn-soft: #3a2b0f;
  --bad: #ff8f84;
  --bad-soft: #3d1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  padding-block: max(20px, env(safe-area-inset-top, 0px)) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: 1.2rem; font-weight: 600; }
h2 { font-size: 1.05rem; font-weight: 600; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.brand p { color: var(--muted); font-size: .84rem; }
.right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.who { display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--muted); }
.nav { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface2); padding: 3px; border-radius: 8px; }
.nav button { border: 0; background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 6px; font-weight: 500; cursor: pointer; }
.nav button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }

.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.sub { color: var(--muted); font-size: .88rem; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

.lbl { display: block; font-weight: 500; font-size: .85rem; margin-bottom: 6px; }
input[type=number], input[type=text], input[type=email], input[type=password], select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 240px; font-family: var(--mono); font-size: .84rem; line-height: 1.55; resize: vertical; }
textarea.ro-box { min-height: 150px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--surface2); }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.1); }
.btn-danger { color: var(--bad); border-color: var(--bad); }
.btn-sm { padding: 5px 10px; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 7px; align-items: center; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); font-size: .86rem; }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.chip input { margin: 0; }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }

.stats { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.stat b { display: block; font-family: var(--mono); font-size: 1.45rem; font-weight: 500; line-height: 1.2; }
.stat span { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

.notice { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 12px 14px; }
.notice.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.empty { padding: 28px 22px; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface); }
.empty h2 { margin-bottom: 6px; }

.authwrap { max-width: 420px; margin: 6vh auto 0; }
.seg { display: flex; gap: 4px; background: var(--surface2); padding: 3px; border-radius: 8px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 6px; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.msg { font-size: .88rem; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--ok); }
ol.steps { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
code { font-family: var(--mono); font-size: .86em; background: var(--surface2); padding: 1px 5px; border-radius: 4px; }

.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; letter-spacing: .03em; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.skip { background: var(--surface2); color: var(--muted); }
.pill.flag { background: var(--warn-soft); color: var(--warn); }
.pill.subj { background: var(--accent-soft); color: var(--accent); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.me td { background: var(--accent-soft); }
.bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* Exam */
.exam-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.timer { font-family: var(--mono); font-size: 1.4rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer.low { color: var(--warn); }
.timer.crit { color: var(--bad); }
.exam-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
@media (max-width: 820px) { .exam-grid { grid-template-columns: minmax(0, 1fr); } }
.qhead { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: .88rem; }
.stem { font-size: 1.08rem; line-height: 1.6; margin-bottom: 18px; max-width: 70ch; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; text-align: left; width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px; cursor: pointer; align-items: flex-start; }
.opt:hover { border-color: var(--accent); }
.opt .l { flex: none; width: 1.8em; height: 1.8em; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: .8rem; background: var(--surface); }
.opt .t { min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
.opt[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.opt[aria-checked="true"] .l { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.qnav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.qnav .grow { flex: 1; }
.btn.flagged { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

.pal-scroll { max-height: 50vh; overflow-y: auto; padding: 2px; }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.pal { position: relative; font-family: var(--mono); font-size: .82rem; padding: 8px 0; border-radius: 4px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; }
.pal.ans { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pal.flag::after { content: ""; position: absolute; top: -1px; right: -1px; border-style: solid; border-width: 0 12px 12px 0; border-color: transparent var(--warn) transparent transparent; }
.pal.cur { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); margin-top: 12px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 5px; background: var(--surface2); }
.sw.ans { background: var(--ok-soft); border-color: var(--ok); }
.sw.flag { background: var(--warn); border-color: var(--warn); }

/* Result + review */
.score { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; }
.pct { font-family: var(--mono); font-size: 3.1rem; font-weight: 500; line-height: 1; }
.ri { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
.ri:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.ro { display: flex; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; align-items: flex-start; }
.ro .t { min-width: 0; overflow-wrap: anywhere; }
.ro .k { flex: none; font-family: var(--mono); width: 1.4em; }
.ro .tag { margin-left: auto; flex: none; font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding-left: 8px; }
.ro.correct { background: var(--ok-soft); border-color: var(--ok); }
.ro.correct .tag { color: var(--ok); }
.ro.wrong { background: var(--bad-soft); border-color: var(--bad); }
.ro.wrong .tag { color: var(--bad); }
.also { margin: 14px 0 0; padding-top: 10px; border-top: 1px dashed var(--line); font-size: .84rem; color: var(--muted); }
.fopen { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--accent); cursor: pointer; text-align: left; }
.fopen:hover { text-decoration: underline; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: .9rem; }
.exp { margin-top: 12px; padding: 10px 12px; background: var(--surface2); border-radius: 6px; font-size: .9rem; overflow-wrap: anywhere; }

.help pre { margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: .82rem; line-height: 1.55; }
details > summary { cursor: pointer; font-weight: 500; }
.issues { margin: 8px 0 0; padding-left: 18px; color: var(--bad); font-size: .88rem; }
.qrow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.qrow:first-child { border-top: 0; }
.qrow .qt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.qrow .qn { flex: none; width: 2.6em; color: var(--muted); font-family: var(--mono); font-size: .82rem; padding-top: 2px; }
.foot { margin-top: 24px; color: var(--muted); font-size: .8rem; }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 6px; max-width: calc(100% - 32px); z-index: 20; font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
'use strict';

var LET = 'ABCDEF';
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function nl(s) { return esc(s).replace(/\n/g, '<br>'); }
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = new Uint8Array(16); crypto.getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s) { return String(s).toLowerCase().replace(/\s+/g, ' ').trim(); }

//#parser-start
function qStart(line) {
  var m = line.match(/^\s*(?:q(?:uestion)?\s*\.?\s*)?(\d{1,4})\s*[\.\):\-]\s+(.+)$/i);
  if (m) return m[2];
  m = line.match(/^\s*q(?:uestion)?\s*[:\.\)\-]\s*(.+)$/i);
  return m ? m[1] : null;
}
function fromJSON(data, defTag) {
  var arr = Array.isArray(data) ? data : (data && data.questions) || [];
  var items = [], issues = [];
  arr.forEach(function (r, i) {
    var q = r.question || r.q || r.stem || '';
    var o = r.options || r.choices || r.o || [];
    var a = r.answer != null ? r.answer : (r.correct != null ? r.correct : r.a);
    var idx = -1;
    if (typeof a === 'number') idx = a;
    else if (typeof a === 'string') {
      var L = LET.indexOf(a.trim().toUpperCase());
      idx = (a.trim().length === 1 && L >= 0) ? L : o.findIndex(function (x) { return norm(x) === norm(a); });
    }
    if (!q || o.length < 2 || idx < 0 || idx >= o.length) { issues.push('Item ' + (i + 1) + ': needs a question, at least 2 options and a valid answer.'); return; }
    items.push({ q: String(q).trim(), o: o.map(function (x) { return String(x).trim(); }), a: idx, e: String(r.explanation || r.exp || r.e || '').trim(), t: String(r.subject || r.tag || r.t || defTag || '').trim() });
  });
  return { items: items, issues: issues };
}
function parseMCQ(text, defTag) {
  text = String(text || '').replace(/\r/g, '').trim();
  if (!text) return { items: [], issues: [] };
  if (text[0] === '[' || text[0] === '{') { try { return fromJSON(JSON.parse(text), defTag); } catch (e) { /* fall through to text format */ } }
  var OPT = /^\s*(\*?)\s*\(?([A-Fa-f])[\.\)\:]\s+(.*\S.*)$/;
  var ANS = /^\s*(?:correct\s+)?(?:ans(?:wer)?|key|correct)\s*(?:is)?\s*[:\-=]?\s*\(?([A-Fa-f])\)?(?![A-Za-z0-9])/i;
  var EXP = /^\s*(?:explanation|exp|rationale|reason|note)\s*[:\-]\s*(.*)$/i;
  var TAG = /^\s*(?:subject|topic|tag|chapter|category)\s*[:\-]\s*(.+)$/i;
  var lines = text.split('\n');
  var items = [], issues = [], cur = null, last = null, blank = true, blockTag = '', count = 0;
  function finish() {
    if (!cur) return;
    count++;
    var label = 'Question ' + count + ' (line ' + cur.line + ')';
    if (cur.o.length < 2) issues.push(label + ': fewer than 2 options found.');
    else if (cur.a < 0 || cur.a >= cur.o.length) issues.push(label + ': no correct answer found. Add a line like "Answer: C".');
    else items.push({ q: cur.q.trim(), o: cur.o, a: cur.a, e: cur.e.trim(), t: cur.t });
    cur = null; last = null;
  }
  for (var ln = 0; ln < lines.length; ln++) {
    var line = lines[ln].trim();
    if (!line) { blank = true; continue; }
    var m;
    if ((m = line.match(TAG))) {
      if (cur && !blank) { cur.t = m[1].trim(); blank = false; } else { blockTag = m[1].trim(); }
      continue;
    }
    if (cur && cur.o.length >= 2 && (m = line.match(EXP))) { cur.e = m[1].trim(); last = 'exp'; blank = false; continue; }
    if (cur && cur.o.length >= 2 && (m = line.match(ANS))) { cur.a = LET.indexOf(m[1].toUpperCase()); last = 'ans'; blank = false; continue; }
    if (cur) {
      var om = line.match(OPT);
      if (om && last !== 'ans' && last !== 'exp' && LET.indexOf(om[2].toUpperCase()) === cur.o.length) {
        var txt = om[3].trim(), star = om[1] === '*';
        if (/\s\*$/.test(txt)) { star = true; txt = txt.replace(/\s*\*$/, ''); }
        cur.o.push(txt);
        if (star) cur.a = cur.o.length - 1;
        last = 'opt'; blank = false; continue;
      }
    }
    var qs = qStart(line);
    var isNew = !cur;
    if (cur && cur.o.length >= 2) isNew = !!qs || blank;
    else if (cur) isNew = blank && !!qs;
    if (isNew) {
      finish();
      cur = { q: qs != null ? qs : line, o: [], a: -1, e: '', t: blockTag || defTag || '', line: ln + 1 };
      last = 'q'; blank = false; continue;
    }
    if (last === 'opt') cur.o[cur.o.length - 1] += ' ' + line;
    else if (last === 'exp' || last === 'ans') cur.e += (cur.e ? ' ' : '') + line;
    else cur.q += '\n' + line;
    blank = false;
  }
  finish();
  return { items: items, issues: issues };
}
//#parser-end

/* ---------- state ---------- */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};
var sb = null;
var S = freshState();
function freshState() {
  return {
    mode: 'auth', loading: false, loadErr: '', busy: false,
    uid: null, user: null, profile: null, isAdmin: false,
    auth: { mode: 'in', name: '', email: '', pass: '', msg: null },
    tab: 'practice', view: 'home',
    bank: [], attempts: [], saved: null, lb: undefined,
    exam: null, result: null, rf: 'all',
    setup: { count: null, minutes: null, touched: false, subj: [], shq: true, sho: false, mode: 'unseen' },
    imp: { text: '', tag: '', parsed: null },
    q: '', confirm: '', confirmSubmit: false,
    editId: null, ed: null, ren: null, bsub: '', copyReport: null, bcopies: false, fp: '', fnew: false, fren: null, fmove: null
  };
}
function resetUser() {
  stopTick();
  var keep = { mode: S.mode, auth: { mode: 'in', name: '', email: '', pass: '', msg: null } };
  S = freshState(); S.mode = keep.mode; S.auth = keep.auth;
}

function toast(msg) {
  var t = $('#toast'); if (!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 4800);
}
function errText(e) {
  var m = (e && e.message) ? e.message : String(e);
  if (/row-level security/i.test(m)) return 'You do not have permission to do that.';
  return m;
}

/* ---------- database mapping ---------- */
function fromQ(r) { return { id: r.id, q: r.stem, o: r.options, a: r.answer, e: r.explanation || '', t: r.subject || '' }; }
function toQ(it) { return { subject: it.t || '', stem: it.q, options: it.o, answer: it.a, explanation: it.e || '' }; }
function fromA(r) { return { id: r.id, startedAt: Date.parse(r.started_at), finishedAt: Date.parse(r.finished_at), limit: r.limit_sec, used: r.used_sec, total: r.total, correct: r.correct, wrong: r.wrong, skipped: r.skipped, qids: r.qids || [], ans: r.answers || {}, flag: r.flagged || [], subj: r.subj || [] }; }
function toA(a) { return { id: a.id, started_at: new Date(a.startedAt).toISOString(), finished_at: new Date(a.finishedAt).toISOString(), limit_sec: a.limit, used_sec: a.used, total: a.total, correct: a.correct, wrong: a.wrong, skipped: a.skipped, qids: a.qids, answers: a.ans, flagged: a.flag, subj: a.subj }; }

function fetchAll(table, orderCol, asc) {
  var out = [], step = 1000;
  function page(from) {
    return sb.from(table).select('*').order(orderCol, { ascending: asc }).order('id', { ascending: true }).range(from, from + step - 1).then(function (r) {
      if (r.error) throw r.error;
      var d = r.data || [];
      out = out.concat(d);
      return d.length < step ? out : page(from + step);
    });
  }
  return page(0);
}

/* Exact copies: the question text and every option match, in the same order (capitals and extra spaces ignored).
   Copies are allowed. They are only reported, so the admin can see which paper each one is also in. */
function dupKey(q, o) { return norm(q) + '||' + o.map(norm).join('||'); }
function plabel(t) { return t || 'Untagged'; }
//#sim-start
/* Near-copy detection: "the same question asked in a different way".
   It compares the key words of the question (rare words count more), the correct answer, and the options.
   It reads words, not meaning, so it catches rewordings that keep the key terms and the same correct answer. */
var SIM_THRESH = 0.6;
var STOP = {};
('a an the of in on at to for with from by and or not is are was were be been being as it its this that these those which what who whom whose when where why how do does did can could may might will would shall should has have had ' +
 'following follows below above all none any both either neither only most more least less than then also about regarding concerning true false correct incorrect except best one ' +
 'due statement statements option options choose select identify give given commonly usually typically major principal main chief mostly').split(' ').forEach(function (w) { STOP[w] = 1; });
var SYN = { innervate: 'supply', innervates: 'supply', innervated: 'supply', innervation: 'supply', innervating: 'supply', supplies: 'supply', supplied: 'supply', supplying: 'supply',
  result: 'cause', results: 'cause', resulting: 'cause', resulted: 'cause', cause: 'cause', causes: 'cause', caused: 'cause', causing: 'cause', leads: 'cause', lead: 'cause', leading: 'cause' };
function stemWord(w) {
  if (SYN[w]) return SYN[w];
  if (/^[0-9]+$/.test(w)) return w;
  var x = w;
  if (x.length > 4 && /ies$/.test(x)) x = x.slice(0, -3) + 'y';
  else if (x.length > 4 && /(sses|xes|ches|shes)$/.test(x)) x = x.slice(0, -2);
  else if (x.length > 3 && /s$/.test(x) && !/(ss|us|is)$/.test(x)) x = x.slice(0, -1);
  if (x.length > 5 && /ing$/.test(x)) x = x.slice(0, -3);
  else if (x.length > 4 && /ed$/.test(x)) x = x.slice(0, -2);
  if (x.length > 4 && /e$/.test(x)) x = x.slice(0, -1);
  return x;
}
function tok(str, dropStop) {
  var out = [];
  String(str).toLowerCase().split(/[^a-z0-9]+/).forEach(function (w) {
    if (!w || (dropStop && STOP[w])) return;
    out.push(stemWord(w));
  });
  return out;
}
function toSet(arr) { var o = {}; arr.forEach(function (t) { o[t] = 1; }); return o; }
function jac(A, B) {
  var inter = 0, uni = 0, t;
  for (t in A) { uni++; if (B[t]) inter++; }
  for (t in B) if (!A[t]) uni++;
  return uni ? inter / uni : 0;
}
function simPrep(q, o, a) {
  var stem = toSet(tok(q, true)), n = 0, opts = {}, t;
  for (t in stem) n++;
  o.forEach(function (x) { tok(x, false).forEach(function (w) { opts[w] = 1; }); });
  return { stem: stem, n: n, ans: toSet(tok(o[a] || '', false)), opts: opts, key: dupKey(q, o) };
}
function simScore(A, B, idf) {
  if (A.key === B.key) return { score: 1, exact: true };
  var inter = 0, uni = 0, wa = 0, wb = 0, t, w;
  for (t in A.stem) { w = idf(t); wa += w; uni += w; if (B.stem[t]) inter += w; }
  for (t in B.stem) { w = idf(t); wb += w; if (!A.stem[t]) uni += w; }
  /* One question must say (nearly) everything the other says; if each has its own different key words it is a different question. */
  if (!uni || inter / Math.min(wa, wb) < 0.8) return null;
  var ss = inter / uni;
  ss *= Math.min(1, Math.min(A.n, B.n) / 3);
  var sa = jac(A.ans, B.ans);
  if (sa < 0.6 || ss < 0.3) return null;
  var score = 0.5 * ss + 0.3 * sa + 0.2 * jac(A.opts, B.opts);
  return score >= SIM_THRESH ? { score: score, exact: false } : null;
}
var SIM = { ref: null, len: -1 };
function simBuild() {
  if (SIM.ref === S.bank && SIM.len === S.bank.length) return;
  var ents = S.bank.map(function (q) { return { id: q.id, q: q, p: simPrep(q.q, q.o, q.a) }; });
  var df = {}, idx = {}, byKey = {}, byId = {}, nb = {}, t;
  ents.forEach(function (e, i) {
    byId[e.id] = e;
    (byKey[e.p.key] = byKey[e.p.key] || []).push(i);
    for (t in e.p.stem) { df[t] = (df[t] || 0) + 1; (idx[t] = idx[t] || []).push(i); }
  });
  var N = ents.length;
  var idf = function (x) { return Math.log(1 + (N + 1) / (Math.max(df[x] || 0, 1) + 1)); };
  function link(a, b, r) {
    (nb[a.id] = nb[a.id] || []).push({ id: b.id, score: r.score, exact: r.exact });
    (nb[b.id] = nb[b.id] || []).push({ id: a.id, score: r.score, exact: r.exact });
  }
  ents.forEach(function (e, i) {
    var seen = {}, k, j, r;
    var same = byKey[e.p.key];
    for (k = 0; k < same.length; k++) { j = same[k]; if (j <= i) continue; seen[j] = 1; link(e, ents[j], { score: 1, exact: true }); }
    for (t in e.p.stem) {
      var post = idx[t]; if (post.length > 300) continue;
      for (k = 0; k < post.length; k++) {
        j = post[k]; if (j <= i || seen[j]) continue; seen[j] = 1;
        r = simScore(e.p, ents[j].p, idf); if (r) link(e, ents[j], r);
      }
    }
  });
  SIM = { ref: S.bank, len: N, ents: ents, idx: idx, byKey: byKey, byId: byId, idf: idf, nb: nb };
}
function neighborsOf(id) { simBuild(); return SIM.nb[id] || []; }
/* Papers (subjects) where the same or a very similar question also lives. */
function alsoIn(q, includeSame) {
  var own = plabel(q.t), seen = {}, out = [];
  neighborsOf(q.id).forEach(function (n) {
    var e = SIM.byId[n.id]; if (!e) return;
    var l = plabel(e.q.t);
    if (l === own && !includeSame) return;
    if (!seen[l]) { seen[l] = 1; out.push(l + (l === own ? ' (same paper)' : '')); }
  });
  return out.sort();
}
/* For rows about to be added: which ones look like a copy of something in the bank or earlier in the same upload. */
function simNew(items) {
  simBuild();
  var preps = items.map(function (it) { return simPrep(it.q, it.o, it.a); }), rows = [];
  items.forEach(function (it, i) {
    var P = preps[i], seen = {}, nbs = [], t, k, j, r;
    function add(text, label, r2) { nbs.push({ q: text, t: label, exact: r2.exact, score: r2.score }); }
    (SIM.byKey[P.key] || []).forEach(function (bi) { seen[bi] = 1; add(SIM.ents[bi].q.q, plabel(SIM.ents[bi].q.t), { score: 1, exact: true }); });
    for (t in P.stem) {
      var post = SIM.idx[t]; if (!post || post.length > 300) continue;
      for (k = 0; k < post.length; k++) {
        j = post[k]; if (seen[j]) continue; seen[j] = 1;
        r = simScore(P, SIM.ents[j].p, SIM.idf); if (r) add(SIM.ents[j].q.q, plabel(SIM.ents[j].q.t), r);
      }
    }
    for (j = 0; j < i; j++) {
      r = simScore(P, preps[j], SIM.idf); if (r) add(items[j].q, plabel(items[j].t), r);
    }
    if (nbs.length) {
      nbs.sort(function (x, y) { return y.score - x.score; });
      rows.push({ q: it.q, t: plabel(it.t), nbs: nbs });
    }
  });
  return rows;
}
//#sim-end

function addQuestions(items) {
  items.forEach(function (it) { it.t = normPath(it.t); });
  var copies = simNew(items);
  var added = [], p = Promise.resolve();
  for (var i = 0; i < items.length; i += 200) {
    (function (chunk) {
      p = p.then(function () { return sb.from('questions').insert(chunk.map(toQ)).select(); }).then(function (r) {
        if (r.error) throw r.error;
        added = added.concat((r.data || []).map(fromQ));
      });
    })(items.slice(i, i + 200));
  }
  return p.then(function () { return { added: added, copies: copies }; }, function (e) { S.bank = S.bank.concat(added); throw e; });
}

function saveAttempt(a) {
  return sb.from('attempts').insert(toA(a)).then(function (r) {
    if (r.error) throw r.error;
    a.unsaved = false;
  }).catch(function (e) {
    a.unsaved = true;
    toast('Your result could not be saved online: ' + errText(e));
  });
}

/* ---------- sign in / load ---------- */
function signedIn(user) {
  S.uid = user.id; S.user = user; S.loading = true; S.loadErr = ''; render();
  Promise.all([
    sb.from('profiles').select('display_name').eq('id', user.id).maybeSingle(),
    sb.rpc('is_admin'),
    fetchAll('questions', 'created_at', true),
    fetchAll('attempts', 'finished_at', false)
  ]).then(function (r) {
    if (r[0].error) throw r[0].error;
    if (r[1].error) throw r[1].error;
    S.profile = r[0].data || { display_name: String(user.email || 'Student').split('@')[0] };
    S.isAdmin = r[1].data === true;
    S.bank = r[2].map(fromQ);
    S.attempts = r[3].map(fromA);
    var sv = LS.get('flp.session.' + user.id, null);
    S.saved = (sv && sv.qids && sv.ans && sv.perm) ? sv : null;
    S.loading = false; S.view = 'home'; S.tab = 'practice'; render();
  }).catch(function (e) {
    S.loading = false; S.loadErr = errText(e) || 'Could not load your data.'; render();
  });
}

function doAuth() {
  var a = S.auth;
  if (S.busy) return;
  var email = a.email.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { a.msg = { t: 'err', m: 'Enter a valid email address.' }; render(); return; }
  if (a.pass.length < 6) { a.msg = { t: 'err', m: 'Use a password with at least 6 characters.' }; render(); return; }
  if (a.mode === 'up' && !a.name.trim()) { a.msg = { t: 'err', m: 'Enter the name you want on the leaderboard.' }; render(); return; }
  S.busy = true; a.msg = null; render();
  var req = a.mode === 'up'
    ? sb.auth.signUp({ email: email, password: a.pass, options: { data: { display_name: a.name.trim() } } })
    : sb.auth.signInWithPassword({ email: email, password: a.pass });
  req.then(function (r) {
    S.busy = false;
    if (r.error) { a.msg = { t: 'err', m: r.error.message }; }
    else if (a.mode === 'up' && !(r.data && r.data.session)) {
      a.msg = { t: 'ok', m: 'Account created. Check your email for a confirmation link, then sign in.' }; a.mode = 'in'; a.pass = '';
    } else { a.pass = ''; }
    render();
  }).catch(function (e) { S.busy = false; a.msg = { t: 'err', m: errText(e) }; render(); });
}

/* ---------- helpers ---------- */
function bankMap() { var m = new Map(); S.bank.forEach(function (q) { m.set(q.id, q); }); return m; }
function subjects() { var m = {}; S.bank.forEach(function (q) { var k = q.t || 'Untagged'; m[k] = (m[k] || 0) + 1; }); return m; }
function pool() {
  var f = S.setup.subj, seen = {}, out = [];
  var list = f.length ? S.bank.filter(function (q) { return f.indexOf(q.t || 'Untagged') >= 0; }) : S.bank;
  list.forEach(function (q) { var k = dupKey(q.q, q.o); if (seen[k]) return; seen[k] = 1; out.push(q); });
  return out;
}
/* Sort the questions in a selection by what this person did with them last time. */
function classify(P) {
  var M = bankMap(), latest = {};
  S.attempts.slice().sort(function (a, b) { return b.finishedAt - a.finishedAt; }).forEach(function (a) {
    (a.qids || []).forEach(function (id) {
      var q = M.get(id); if (!q) return;
      var k = dupKey(q.q, q.o);
      if (!(k in latest)) latest[k] = a.ans ? a.ans[id] === q.a : false;
    });
  });
  var r = { unseen: [], wrong: [], other: [] };
  P.forEach(function (q) {
    var k = dupKey(q.q, q.o);
    if (!(k in latest)) r.unseen.push(q.id);
    else if (!latest[k]) r.wrong.push(q.id);
    else r.other.push(q.id);
  });
  return r;
}
function pickIds(P, count, mode, shq) {
  var info = classify(P);
  function ord(a) { return shq ? shuffle(a) : a.slice(); }
  var order;
  if (mode === 'wrong') order = ord(info.wrong).concat(ord(info.unseen), ord(info.other));
  else if (mode === 'unseen') order = ord(info.unseen).concat(ord(info.wrong), ord(info.other));
  else order = ord(P.map(function (q) { return q.id; }));
  var chosen = order.slice(0, count);
  return shq ? shuffle(chosen) : chosen;
}
function clock(s) { var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
function dur(s) { var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + 'h ' : '') + m + 'm ' + x + 's'; }
function when(ts) { return new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function pct(c, t) { return t ? (c / t * 100).toFixed(1) : '0.0'; }
function top() { window.scrollTo(0, 0); }

  var s = S.saved; if (!s) return '';
  var left = Math.round((s.endAt - Date.now()) / 1000);
  var answered = Object.keys(s.ans || {}).length;
  if (left > 0) {
    return '<div class="notice"><div class="row between"><div><h3>Exam in progress</h3><p class="sub">' + answered + ' of ' + s.qids.length + ' answered, <span class="mono">' + clock(left) + '</span> left on the clock.</p></div><div class="row"><button class="btn btn-primary" type="button" data-act="resume">Resume</button><button class="btn" type="button" data-act="discard">Discard</button></div></div></div>';
  }
  return '<div class="notice warn"><div class="row between"><div><h3>Time ran out on your last exam</h3><p class="sub">' + answered + ' of ' + s.qids.length + ' answered. Submit it to see your result.</p></div><div class="row"><button class="btn btn-primary" type="button" data-act="resume">Submit and see result</button><button class="btn" type="button" data-act="discard">Discard</button></div></div></div>';
}

/* ---- Folders ----
   "1st Year / Block A / CVS Physiology" is stored in the subject text itself, so folders need no database change.
   A folder exists while some subject sits under it. An empty folder you create is remembered on this device only
   until you add a paper into it. */
var SEP = ' / ';
function normPath(s) { return String(s || '').split('/').map(function (x) { return x.trim().replace(/\s+/g, ' '); }).filter(Boolean).join(SEP); }
function pathSegs(p) { return p ? p.split(SEP) : []; }
function under(k, full) { return !full || k === full || k.indexOf(full + SEP) === 0; }
function remap(k, full, nf) { return k === full ? nf : nf + k.slice(full.length); }
function phList() { var a = LS.get('flp.folders', []); return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'string' && x; }) : []; }
function phSave(a) { LS.set('flp.folders', a.filter(function (x, i) { return a.indexOf(x) === i; })); }
function nat(a, b) { return a.localeCompare(b, undefined, { numeric: true }); }
function folderEntries() {
  var su = subjects(), keys = Object.keys(su), out = keys.map(function (k) { return { key: k, n: su[k], ph: false }; });
  phList().forEach(function (k) {
    if (!keys.some(function (r) { return under(r, k); })) out.push({ key: k, n: 0, ph: true });
  });
  return out;
}
function realKeysUnder(full) { return Object.keys(subjects()).filter(function (k) { return k !== 'Untagged' && under(k, full); }); }
function folderChildren(fp) {
  var P = pathSegs(fp), kids = {};
  folderEntries().forEach(function (e) {
    var sg = pathSegs(e.key);
    if (!under(e.key, fp) || sg.length <= P.length) return;
    var nm = sg[P.length], c = kids[nm] || (kids[nm] = { name: nm, full: P.concat(nm).join(SEP), n: 0, folder: false });
    c.n += e.n;
    if (sg.length > P.length + 1 || e.ph) c.folder = true;
  });
  return Object.keys(kids).sort(nat).map(function (k) { return kids[k]; });
}
function allFolderPaths() {
  var seen = {};
  folderEntries().forEach(function (e) {
    var sg = pathSegs(e.key), n = e.ph ? sg.length : sg.length - 1;
    for (var i = 1; i <= n; i++) seen[sg.slice(0, i).join(SEP)] = 1;
  });
  return Object.keys(seen).sort(nat);
}
function renderFolderPanel() {

/* Rename or move a folder or paper: every subject under it gets the new path. */
function folderMove(full, nf, done) {
  var keys = realKeysUnder(full), pairs = keys.map(function (k) { return { from: k, to: remap(k, full, nf) }; }), moved = 0, i = 0, failed = null;
  function finish() {
    var ph = phList().map(function (k) { return under(k, full) ? remap(k, full, nf) : k; });
    phSave(ph);
    var st = S.setup;
    st.subj = st.subj.map(function (k) { return under(k, full) ? remap(k, full, nf) : k; }).filter(function (k, j, a) { return a.indexOf(k) === j; });
    st.count = null;
    if (S.bsub && under(S.bsub, full)) S.bsub = remap(S.bsub, full, nf);
    if (S.fp && under(S.fp, full)) S.fp = remap(S.fp, full, nf);
    done(failed, moved);
  }
  (function next() {
    if (i >= pairs.length) { finish(); return; }
    var pr = pairs[i++];
    sb.from('questions').update({ subject: pr.to }).eq('subject', pr.from).select('id').then(function (res) {
      if (res.error) { failed = errText(res.error); finish(); return; }
      if (!res.data || !res.data.length) { failed = 'No questions were changed. You may not have permission.'; finish(); return; }
      S.bank.forEach(function (q) { if ((q.t || '') === pr.from) q.t = pr.to; });
      moved += res.data.length; next();
    });
  })();
}
function folderDone(msg) {
  return function (failed, moved) {
    S.busy = false; S.fren = null; S.fmove = null; S.confirm = '';
    toast(failed ? 'Stopped: ' + failed + (moved ? ' (' + moved + ' already changed)' : '') : msg(moved));
    renderManageParts();
  };
}

function reviewItem(a, id, n, M) {

  if (S.uid && S.view === 'home' && S.tab === 'manage' && S.isAdmin) renderManageParts();

/* ---------- exam flow ---------- */
var tickId = null;
function startTick() { stopTick(); tickId = setInterval(tick, 500); tick(); }
function stopTick() { if (tickId) { clearInterval(tickId); tickId = null; } }
function tick() {
  if (!S.exam || (S.view !== 'exam' && S.view !== 'finish')) { stopTick(); return; }
  var rem = Math.max(0, Math.round((S.exam.endAt - Date.now()) / 1000));
  var el = $('#timer');
  if (el) { el.textContent = clock(rem); el.className = 'timer' + (rem <= 60 ? ' crit' : (rem <= Math.max(300, S.exam.limit * 0.1) ? ' low' : '')); }
  if (rem <= 0) { toast('Time is up. Your paper was submitted.'); submitExam(); }
}
function saveSession() { if (S.exam && S.uid) LS.set('flp.session.' + S.uid, S.exam); }

function beginExam(qids, minutes, shuffleO) {
  var M = bankMap(), perm = {};
  qids.forEach(function (id) { var idx = M.get(id).o.map(function (_, i) { return i; }); perm[id] = shuffleO ? shuffle(idx) : idx; });
  var secs = Math.round(minutes * 60), now = Date.now();
  S.exam = { id: uuid(), qids: qids, perm: perm, ans: {}, flag: {}, i: 0, startedAt: now, limit: secs, endAt: now + secs * 1000 };
  S.saved = S.exam; S.view = 'exam'; S.confirmSubmit = false;
  saveSession(); render(); startTick(); top();
}

function submitExam() {
  var ex = S.exam; if (!ex) return;
  var M = bankMap(), correct = 0, wrong = 0, skipped = 0, per = {};
  ex.qids.forEach(function (id) {
    var q = M.get(id); if (!q) return;
    var k = q.t || 'Untagged'; per[k] = per[k] || { t: k, c: 0, n: 0 }; per[k].n++;
    var a = ex.ans[id];
    if (a == null) skipped++; else if (a === q.a) { correct++; per[k].c++; } else wrong++;
  });
  var now = Date.now();
  var att = { id: ex.id, startedAt: ex.startedAt, finishedAt: now, limit: ex.limit, used: Math.min(ex.limit, Math.round((now - ex.startedAt) / 1000)), total: correct + wrong + skipped, correct: correct, wrong: wrong, skipped: skipped, qids: ex.qids, ans: ex.ans, flag: ex.qids.filter(function (id) { return ex.flag[id]; }), subj: Object.keys(per).map(function (k) { return per[k]; }) };
  S.attempts.unshift(att);
  LS.del('flp.session.' + S.uid); S.saved = null; S.exam = null; S.result = att; S.view = 'result'; S.rf = 'all'; S.confirmSubmit = false;
  stopTick(); render(); top();
  saveAttempt(att).then(function () { if (S.view === 'result' && S.result === att) render(); });
}

function goTo(i) {
  var ex = S.exam; if (!ex) return;
  ex.i = Math.max(0, Math.min(ex.qids.length - 1, i));
  S.view = 'exam'; S.confirmSubmit = false; saveSession(); render(); startTick();
  if (!window.matchMedia('(max-width: 820px)').matches) top();
}
function pickOption(orig) { var ex = S.exam; ex.ans[ex.qids[ex.i]] = orig; saveSession(); render(); }

function loadLB() {
  S.lb = null; render();
  sb.rpc('get_leaderboard').then(function (r) {
    S.lb = r.error ? { error: errText(r.error) } : (r.data || []);
    if (S.tab === 'leaderboard' && S.view === 'home') render();
  });
}

/* ---------- actions ---------- */
var A = {
  tab: function (t) {
    S.tab = t.dataset.tab; S.view = 'home'; S.confirm = ''; S.editId = null; S.ed = null; S.ren = null;
    if (S.tab === 'leaderboard') { loadLB(); } else { render(); }
    top();
  },
  authmode: function (t) { S.auth.mode = t.dataset.m; S.auth.msg = null; render(); },
  signout: function () { stopTick(); if (sb) sb.auth.signOut(); },
  retry: function () { var u = S.user; S.uid = null; if (u) signedIn(u); },
  reloadlb: function () { loadLB(); },
  resave: function () { var a = S.result; if (!a) return; saveAttempt(a).then(function () { render(); if (!a.unsaved) toast('Result saved.'); }); },
  samples: function () {
    if (S.busy) return;
    S.busy = true;
    var haveS = {}; S.bank.forEach(function (q) { haveS[dupKey(q.q, q.o)] = 1; });
    var freshS = SAMPLES.filter(function (x) { return !haveS[dupKey(x.q, x.o)]; });
    if (!freshS.length) { S.busy = false; toast('The sample questions are already in the bank.'); return; }
    addQuestions(freshS).then(function (r) {
      S.busy = false;
      if (!r.added.length) { toast('The sample questions are already in the bank.'); return; }
      S.bank = S.bank.concat(r.added); toast(r.added.length + ' sample questions added.'); render();
    }).catch(function (e) { S.busy = false; toast('Could not add questions: ' + errText(e)); render(); });
  },
  start: function () {
    var P = pool(), st = S.setup;
    var count = Math.floor(Number($('#cnt').value)), mins = Number($('#mins').value);
    if (!(count >= 1)) { toast('Enter at least 1 question.'); return; }
    if (!(mins >= 1)) { toast('Enter a time limit of at least 1 minute.'); return; }
    count = Math.min(count, P.length);
    beginExam(pickIds(P, count, st.mode || 'unseen', st.shq), mins, st.sho);
  },
  resume: function () {
    S.exam = S.saved; if (!S.exam) return;
    var M = bankMap();
    if (S.exam.qids.some(function (id) { var q = M.get(id); return !q || !S.exam.perm[id] || S.exam.perm[id].length !== q.o.length; })) { toast('Some questions in that paper were removed or changed. It was discarded.'); LS.del('flp.session.' + S.uid); S.saved = null; S.exam = null; render(); return; }
    if (S.exam.endAt <= Date.now()) { submitExam(); return; }
    S.view = 'exam'; render(); startTick(); top();
  },
  discard: function () { LS.del('flp.session.' + S.uid); S.saved = null; render(); },
  pick: function (t) { pickOption(Number(t.dataset.o)); },
  go: function (t) { goTo(Number(t.dataset.i)); },
  prev: function () { goTo(S.exam.i - 1); },
  next: function () { goTo(S.exam.i + 1); },
  flag: function () { var ex = S.exam, id = ex.qids[ex.i]; ex.flag[id] = !ex.flag[id]; if (!ex.flag[id]) delete ex.flag[id]; saveSession(); render(); },
  clear: function () { var ex = S.exam; delete ex.ans[ex.qids[ex.i]]; saveSession(); render(); },
  finish: function () { S.view = 'finish'; S.confirmSubmit = false; render(); startTick(); top(); },
  back: function () { S.view = 'exam'; S.confirmSubmit = false; render(); startTick(); },
  confirmsubmit: function () { S.confirmSubmit = true; render(); startTick(); },
  submit: function () { submitExam(); },
  retake: function () {
    var a = S.result, M = bankMap();
    var ids = a.qids.filter(function (id) { return M.get(id) && a.ans[id] !== M.get(id).a; });
    if (!ids.length) return;
    var mins = Math.max(1, Math.round(a.limit / 60 * ids.length / Math.max(1, a.total)));
    beginExam(shuffle(ids), mins, S.setup.sho);
  },
  rf: function (t) { S.rf = t.dataset.f; render(); },
  open: function (t) { var a = S.attempts.filter(function (x) { return x.id === t.dataset.id; })[0]; if (!a) return; S.result = a; S.view = 'result'; S.rf = 'all'; render(); top(); },
  delattempt: function (t) {
    var k = 'a:' + t.dataset.id, id = t.dataset.id;
    if (S.confirm !== k) { S.confirm = k; render(); return; }
    S.confirm = '';
    sb.from('attempts').delete().eq('id', id).select('id').then(function (r) {
      if (r.error) { toast('Could not delete: ' + errText(r.error)); return; }
      S.attempts = S.attempts.filter(function (a) { return a.id !== id; }); render();
    });
  },
  check: function () {
    S.imp.text = $('#imptext').value; S.imp.tag = normPath($('#imptag').value);
    S.imp.parsed = parseMCQ(S.imp.text, S.imp.tag);
    S.imp.sim = S.imp.parsed.items.length ? simNew(S.imp.parsed.items) : [];
    if (!S.imp.text.trim()) toast('Paste some questions first.');
    render();
  },
  import: function () {
    var pr = S.imp.parsed; if (!pr || !pr.items.length || S.busy) return;
    S.busy = true; render();
    addQuestions(pr.items).then(function (r) {
      S.busy = false; S.bank = S.bank.concat(r.added);
      S.imp = { text: '', tag: '', parsed: null };
      S.copyReport = r.copies.length ? { added: r.added.length, rows: r.copies } : null;
      toast(r.added.length + ' added' + (r.copies.length ? '. ' + r.copies.length + ' of them ' + (r.copies.length === 1 ? 'is a copy' : 'are copies') + ' of existing questions, see the list below.' : '.'));
      render();
    }).catch(function (e) { S.busy = false; toast('Could not add questions: ' + errText(e)); render(); });
  },
  delq: function (t) {
    var k = 'q:' + t.dataset.id, id = t.dataset.id;
    if (S.confirm !== k) { S.confirm = k; renderBankList(); return; }
    S.confirm = '';
    sb.from('questions').delete().eq('id', id).select('id').then(function (r) {
      if (r.error) { toast('Could not delete: ' + errText(r.error)); return; }
      if (!r.data || !r.data.length) { toast('You do not have permission to delete questions.'); return; }
      S.bank = S.bank.filter(function (q) { return q.id !== id; }); render();
    });
  },
  delall: function () {
    if (S.confirm !== 'all') { S.confirm = 'all'; render(); return; }
    S.confirm = '';
    sb.from('questions').delete().neq('id', '00000000-0000-0000-0000-000000000000').select('id').then(function (r) {
      if (r.error) { toast('Could not delete: ' + errText(r.error)); return; }
      S.bank = []; S.setup.count = null; S.setup.subj = []; render(); toast('Question bank cleared.');
    });
  },
  edit: function (t) {
    var q = S.bank.filter(function (x) { return x.id === t.dataset.id; })[0]; if (!q) return;
    S.editId = q.id; S.confirm = ''; S.ed = { q: q.q, o: q.o.slice(), a: q.a, e: q.e || '', t: q.t || '' };
    renderBankList();
    var el = $('#ed-q'); if (el) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
  },
  delsubj: function (t) { S.confirm = 's:' + t.dataset.k; S.ren = null; renderSubjPanel(); },
  delsubjno: function () { S.confirm = ''; renderSubjPanel(); },
  delsubjyes: function (t) {
    if (S.busy) return;
    var k = t.dataset.k, oldVal = k === 'Untagged' ? '' : k;
    S.busy = true; renderSubjPanel();
    sb.from('questions').delete().eq('subject', oldVal).select('id').then(function (res) {
      S.busy = false;
      if (res.error) { toast('Could not delete: ' + errText(res.error)); renderSubjPanel(); return; }
      if (!res.data || !res.data.length) { toast('No questions were deleted. You may not have permission.'); S.confirm = ''; renderSubjPanel(); return; }
      var gone = {}; res.data.forEach(function (r) { gone[r.id] = 1; });
      S.bank = S.bank.filter(function (q) { return !gone[q.id]; });
      var st = S.setup; st.subj = st.subj.filter(function (x) { return x !== k; }); st.count = null;
      if (S.bsub === k) S.bsub = '';
      if (S.editId && gone[S.editId]) { S.editId = null; S.ed = null; }
      S.confirm = '';
      toast('Deleted "' + k + '" and its ' + res.data.length + ' question' + (res.data.length === 1 ? '' : 's') + '.');
      renderManageParts();
    });
  },
  fgo: function (t) { S.fp = t.dataset.p || ''; S.fnew = false; S.fren = null; S.fmove = null; S.confirm = ''; renderFolderPanel(); },
  fpaper: function (t) {
    S.bsub = t.dataset.p; renderBankList();
    var b = $('#bank-h'); if (b && b.scrollIntoView) b.scrollIntoView({ behavior: 'smooth', block: 'start' });
    toast('Showing the questions in "' + t.dataset.p + '" in the bank below.');
  },
  fnew: function () { S.fnew = true; S.fren = null; S.fmove = null; renderFolderPanel(); var el = $('#fnew-name'); if (el) el.focus(); },
  fnewcancel: function () { S.fnew = false; renderFolderPanel(); },
  fnewsave: function () {
    var el = $('#fnew-name'), name = normPath(el ? el.value : '');
    if (!name) { toast('Type a name for the folder.'); return; }
    var full = S.fp ? S.fp + SEP + name : name;
    phSave(phList().concat(full));
    S.fnew = false; toast('Folder "' + name + '" created. Open it to put papers or sub-folders inside.');
    renderFolderPanel();
  },
  fhere: function () {
    var el = $('#imptag'); if (!el) return;
    S.imp.tag = S.fp ? S.fp + SEP : ''; el.value = S.imp.tag;
    el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* ignore */ }
    if (el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast(S.fp ? 'Type the paper name after the folder path, then paste your questions.' : 'Type the full path, like 1st Year / Block A / CVS Physiology.');
  },
  fren: function (t) { S.fren = t.dataset.p; S.fmove = null; S.confirm = ''; renderFolderPanel(); var el = $('#fren-to'); if (el) { el.focus(); el.select(); } },
  frencancel: function () { S.fren = null; renderFolderPanel(); },
  frensave: function () {
    var full = S.fren; if (!full || S.busy) return;
    var el = $('#fren-to'), raw = el ? el.value : '';
    if (raw.indexOf('/') >= 0) { toast('A name cannot contain "/". Use Move to put it inside another folder.'); return; }
    var to = normPath(raw);
    if (!to) { toast('Type the new name.'); return; }
    if (to === 'Untagged') { toast('Pick a different name. Untagged is reserved.'); return; }
    var sg = pathSegs(full), nf = sg.slice(0, -1).concat(to).join(SEP);
    if (nf === full) { toast('That is the same name.'); return; }
    S.busy = true; renderFolderPanel();
    folderMove(full, nf, folderDone(function (n) { return 'Renamed to "' + to + '"' + (n ? ' (' + n + ' question' + (n === 1 ? '' : 's') + ' updated).' : '.'); }));
  },
  fmove: function (t) { S.fmove = t.dataset.p; S.fren = null; S.confirm = ''; renderFolderPanel(); },
  fmovecancel: function () { S.fmove = null; renderFolderPanel(); },
  fmovesave: function () {
    var full = S.fmove; if (!full || S.busy) return;
    var el = $('#fmove-to'), dest = el ? el.value : '', name = pathSegs(full).pop(), nf = dest ? dest + SEP + name : name;
    if (under(dest, full) && dest) { toast('A folder cannot be moved inside itself.'); return; }
    if (nf === full) { toast('It is already there.'); return; }
    S.busy = true; renderFolderPanel();
    folderMove(full, nf, folderDone(function () { return 'Moved "' + name + '" into ' + (dest ? '"' + dest + '"' : 'the top level') + '.'; }));
  },
  fdel: function (t) {
    var full = t.dataset.p;
    if (!realKeysUnder(full).length && full !== 'Untagged') {
      phSave(phList().filter(function (k) { return !under(k, full); }));
      if (under(S.fp, full)) S.fp = pathSegs(full).slice(0, -1).join(SEP);
      toast('Empty folder removed.'); renderFolderPanel(); return;
    }
    S.confirm = 'f:' + full; S.fren = null; S.fmove = null; renderFolderPanel();
  },
  fdelno: function () { S.confirm = ''; renderFolderPanel(); },
  fdelyes: function (t) {
    if (S.busy) return;
    var full = t.dataset.p, keys = full === 'Untagged' ? ['Untagged'] : realKeysUnder(full), i = 0, removed = 0, failed = null;
    S.busy = true; renderFolderPanel();
    function finish() {
      S.busy = false; S.confirm = '';
      var st = S.setup; st.subj = st.subj.filter(function (k) { return !under(k, full); }); st.count = null;
      if (S.bsub && under(S.bsub, full)) S.bsub = '';
      if (S.editId && !S.bank.some(function (q) { return q.id === S.editId; })) { S.editId = null; S.ed = null; }
      if (!failed) { phSave(phList().filter(function (k) { return !under(k, full); })); if (under(S.fp, full)) S.fp = pathSegs(full).slice(0, -1).join(SEP); }
      toast(failed ? 'Stopped: ' + failed + (removed ? ' (' + removed + ' already deleted)' : '') : 'Deleted "' + pathSegs(full).pop() + '" and its ' + removed + ' question' + (removed === 1 ? '' : 's') + '.');
      renderManageParts();
    }
    (function next() {
      if (i >= keys.length) { finish(); return; }
      var k = keys[i++];
      sb.from('questions').delete().eq('subject', k === 'Untagged' ? '' : k).select('id').then(function (res) {
        if (res.error) { failed = errText(res.error); finish(); return; }
        if (!res.data || !res.data.length) { failed = 'No questions were deleted. You may not have permission.'; finish(); return; }
        var gone = {}; res.data.forEach(function (r) { gone[r.id] = 1; });
        S.bank = S.bank.filter(function (q) { return !gone[q.id]; });
        removed += res.data.length; next();
      });
    })();
  },
  copyclose: function () { S.copyReport = null; renderCopyReport(); },
  edcancel: function () { S.editId = null; S.ed = null; renderBankList(); },
  edaddopt: function () { if (S.ed && S.ed.o.length < 6) { S.ed.o.push(''); renderBankList(); var el = $('#ed-o-' + (S.ed.o.length - 1)); if (el) el.focus(); } },
  edremopt: function (t) {
    var i = Number(t.dataset.i), d = S.ed; if (!d || d.o.length <= 2) return;
    d.o.splice(i, 1);
    if (d.a === i) d.a = -1; else if (d.a > i) d.a--;
    renderBankList();
  },
  edsave: function () {
    var d = S.ed, id = S.editId; if (!d || !id || S.busy) return;
    var stem = d.q.trim();
    if (!stem) { toast('The question text cannot be empty.'); return; }
    var opts = [], map = -1;
    d.o.forEach(function (o, i) { var tx = o.trim(); if (tx) { if (i === d.a) map = opts.length; opts.push(tx); } });
    if (opts.length < 2) { toast('Keep at least 2 options with text.'); return; }
    if (map < 0) { toast('Select the correct answer, and make sure that option has text.'); return; }
    S.busy = true; renderBankList();
    sb.from('questions').update({ subject: normPath(d.t), stem: stem, options: opts, answer: map, explanation: d.e.trim() }).eq('id', id).select().then(function (r) {
      S.busy = false;
      if (r.error) { toast('Could not save: ' + errText(r.error)); renderBankList(); return; }
      if (!r.data || !r.data.length) { toast('You do not have permission to edit questions.'); renderBankList(); return; }
      var nq = fromQ(r.data[0]);
      S.bank = S.bank.map(function (x) { return x.id === id ? nq : x; });
      S.editId = null; S.ed = null;
      var al = alsoIn(nq, true);
      toast('Question saved.' + (al.length ? ' Identical or similar questions are also in: ' + al.join(', ') + '.' : ''));
      renderManageParts();
    });
  },
  ren: function (t) {
    var k = t.dataset.k;
    S.ren = { from: k, to: k === 'Untagged' ? '' : k };
    renderSubjPanel();
    var el = $('#rename-to'); if (el) { el.focus(); el.select(); }
  },
  rencancel: function () { S.ren = null; renderSubjPanel(); },
  rensave: function () {
    var r = S.ren; if (!r || S.busy) return;
    var to = normPath(r.to), from = r.from;
    if (!to) { toast('Type the new name.'); return; }
    if (to === 'Untagged') { toast('Pick a different name. Untagged is reserved for questions without a subject.'); return; }
    if (to === from) { toast('That is the same name.'); return; }
    var oldVal = from === 'Untagged' ? '' : from;
    S.busy = true; renderSubjPanel();
    sb.from('questions').update({ subject: to }).eq('subject', oldVal).select('id').then(function (res) {
      S.busy = false;
      if (res.error) { toast('Could not rename: ' + errText(res.error)); renderSubjPanel(); return; }
      if (!res.data || !res.data.length) { toast('No questions were changed. You may not have permission.'); renderSubjPanel(); return; }
      S.bank.forEach(function (q) { if ((q.t || '') === oldVal) q.t = to; });
      var st = S.setup;
      st.subj = st.subj.map(function (k) { return k === from ? to : k; }).filter(function (k, i, a) { return a.indexOf(k) === i; });
      st.count = null;
      if (S.bsub === from) S.bsub = to;
      S.ren = null; toast(res.data.length + ' question' + (res.data.length === 1 ? '' : 's') + ' moved to "' + to + '".');
      renderManageParts();
    });
  },
  copyprompt: function () {
    var box = $('#aiprompt');
    function fallback() { if (box) { box.focus(); box.select(); } toast('Copy blocked here. The prompt is selected, press Ctrl+C.'); }
    try { navigator.clipboard.writeText(AI_PROMPT).then(function () { toast('Prompt copied.'); }, fallback); } catch (e) { fallback(); }
  }
};

var app = $('#app');
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var f = A[t.dataset.act]; if (f) f(t, e);
});
app.addEventListener('submit', function (e) {
  if (e.target.id === 'authform') { e.preventDefault(); doAuth(); }
});
app.addEventListener('input', function (e) {
  var id = e.target.id, st = S.setup;
  if (id === 'aname') S.auth.name = e.target.value;
  else if (id === 'aemail') S.auth.email = e.target.value;
  else if (id === 'apass') S.auth.pass = e.target.value;
  else if (id === 'imptext') { S.imp.text = e.target.value; S.imp.parsed = null; }
  else if (id === 'imptag') S.imp.tag = e.target.value;
  else if (id === 'bsearch') { S.q = e.target.value; renderBankList(); }
  else if (id === 'ed-q' && S.ed) S.ed.q = e.target.value;
  else if (id === 'ed-e' && S.ed) S.ed.e = e.target.value;
  else if (id === 'ed-t' && S.ed) S.ed.t = e.target.value;
  else if (/^ed-o-\d+$/.test(id) && S.ed) S.ed.o[Number(id.slice(5))] = e.target.value;
  else if (id === 'rename-to' && S.ren) { S.ren.to = e.target.value; var nn = $('#rename-note'); if (nn) nn.textContent = renNote(); }
  else if (id === 'cnt') { st.count = Math.floor(Number(e.target.value)) || 1; if (!st.touched) { st.minutes = Math.max(1, st.count); var m = $('#mins'); if (m) m.value = st.minutes; } }
  else if (id === 'mins') { st.minutes = Number(e.target.value) || 1; st.touched = true; }
});
app.addEventListener('change', function (e) {
  var t = e.target, st = S.setup;
  if (t.id === 'shq') st.shq = t.checked;
  else if (t.id === 'sho') st.sho = t.checked;
  else if (t.id === 'selmode') { st.mode = t.value; render(); }
  else if (t.id === 'bsubj') { S.bsub = t.value; renderBankList(); }
  else if (t.id === 'bcopies') { S.bcopies = t.checked; renderBankList(); }
  else if (t.name === 'ed-a' && S.ed) { S.ed.a = Number(t.value); }
  else if (t.dataset && t.dataset.subj != null) {
    var k = t.dataset.subj, i = st.subj.indexOf(k);
    if (t.checked && i < 0) st.subj.push(k); else if (!t.checked && i >= 0) st.subj.splice(i, 1);
    st.count = null; render();
  }
});
document.addEventListener('keydown', function (e) {
  if (S.view !== 'exam' || !S.exam) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
  var k = e.key.toLowerCase(), ex = S.exam, id = ex.qids[ex.i];
  if (k === 'arrowright' || k === 'n') { if (ex.i < ex.qids.length - 1) { e.preventDefault(); goTo(ex.i + 1); } }
  else if (k === 'arrowleft' || k === 'p') { if (ex.i > 0) { e.preventDefault(); goTo(ex.i - 1); } }
  else if (k === 'f') { e.preventDefault(); A.flag(); }
  else if (/^[a-e]$/.test(k)) { var pos = LET.indexOf(k.toUpperCase()), perm = ex.perm[id]; if (pos < perm.length) { e.preventDefault(); pickOption(perm[pos]); } }
});

/* ---------- boot ---------- */
function boot() {
  var cfg = window.APP_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || /PASTE_/.test(cfg.SUPABASE_URL) || /PASTE_/.test(cfg.SUPABASE_ANON_KEY)) { S.mode = 'setup'; render(); return; }
  if (!window.supabase || !window.supabase.createClient) { S.mode = 'nolib'; render(); return; }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  S.loading = true; render();
  sb.auth.onAuthStateChange(function (ev, sess) {
    setTimeout(function () {
      if (sess && sess.user) { if (S.uid !== sess.user.id) signedIn(sess.user); }
      else {
        if (ev === 'SIGNED_OUT') resetUser();
        S.loading = false; render();
      }
    }, 0);
  });
}
boot();
})();
</script>
</body>
</html>
